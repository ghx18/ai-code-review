apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicode-redis
  labels:
    app: aicode
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aicode
      component: redis
  template:
    metadata:
      labels:
        app: aicode
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

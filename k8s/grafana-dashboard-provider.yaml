apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  # Grafana 自动从 /var/lib/grafana/dashboards 目录加载所有 json 仪表盘
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards

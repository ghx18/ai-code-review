apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicode-db
  labels:
    app: aicode
    component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aicode
      component: db
  template:
    metadata:
      labels:
        app: aicode
        component: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine-local   # k3d 对 Docker Hub 拉取的镜像导入不兼容，改用本地重建的镜像
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aicode-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "ai_code_review"
          ports:
            - containerPort: 5432
          # postgres 的健康检查：用官方工具 pg_isready
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aicode-db-data

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicode-prometheus
  labels:
    app: aicode
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aicode
      component: prometheus
  template:
    metadata:
      labels:
        app: aicode
        component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prometheus:local
          imagePullPolicy: IfNotPresent
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}   # 学习用，pod 重启数据会丢；生产要用 PV
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: aicode
    component: prometheus
spec:
  type: ClusterIP
  selector:
    app: aicode
    component: prometheus
  ports:
    - port: 9090
      targetPort: 9090

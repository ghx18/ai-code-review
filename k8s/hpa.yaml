# M8: HorizontalPodAutoscaler —— 按 CPU 利用率自动扩缩容
# 前提：Deployment 必须声明 resources.requests.cpu（api/worker 都已是 100m）
# 利用率 = 实际CPU / requests.cpu，每 15s 检查一次，超过目标就扩容、低于就缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aicode-api-hpa
  labels:
    app: aicode
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aicode-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # 超过 50% 就扩容
  behavior:
    scaleDown:
      # 缩容冷却默认 300s（5 分钟），调短到 60s 方便课堂演示观察缩容
      # 生产环境建议保留默认 300s，防止请求抖动导致频繁缩容
      stabilizationWindowSeconds: 60
---
# worker 同样按 CPU 自动扩容（worker 跑代码分析/LLM 分析，是真正的算力大头）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aicode-worker-hpa
  labels:
    app: aicode
    component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aicode-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60

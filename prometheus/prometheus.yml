# Prometheus 全局配置 — 抓取 ai-code-review 的 /metrics
# 容器启动后可通过 http://127.0.0.1:9090 访问（SSH 隧道或本机映射）
global:
  scrape_interval: 15s      # 每 15 秒来抓一次数据
  evaluation_interval: 15s  # 每 15 秒评估一次告警规则

# 加载告警规则
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# 告警推送到 Alertmanager（同一 docker 网络，服务名可达）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ── 抓取 ai-code-review 的 API 容器 ──
  # 走 docker 网络直连 api:8000（绕过 nginx 限流），路径 /metrics
  - job_name: 'ai-code-review'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  # ── 抓 Prometheus 自身状态（可选，看采集是否正常）──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

services:
  # ─── FastAPI (REST API + WebSocket + MCP SSE) ───
  api:
    build: .
    container_name: ai-code-review-api
    ports:
      # 只绑本机：外网不能直连 8000，必须经过 nginx（nginx 用 127.0.0.1:8000 转发）
      - "127.0.0.1:8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY 环境变量}
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/ai_code_review
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-16}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - review_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"   # docker 层日志轮转，防磁盘写满
        max-file: "5"
    networks:
      - review-net

  # ─── Celery Worker (异步审查任务) ──────────────
  worker:
    build: .
    container_name: ai-code-review-worker
    entrypoint: ["celery", "-A", "celery_app", "worker"]
    command: ["--loglevel=info", "--concurrency=4"]
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY 环境变量}
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/ai_code_review
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-16}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - review_data:/app/data   # worker 侧文件日志也落盘持久化（data/logs/app.log）
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net

  # ─── Redis (消息队列 + 结果存储) ──────────────
  redis:
    image: redis:7-alpine
    container_name: ai-code-review-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net

  # ─── PostgreSQL ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ai-code-review-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_code_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net

  # ─── pgAdmin（可选：数据库管理界面）────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-code-review-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@code-review.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5433:80"
    depends_on:
      - db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net
    profiles:
      - dev  # 默认不启动，docker compose --profile dev up 时才启动

  # ─── Prometheus（监控数据抓取 + 告警规则）────────
  # ⚠️ 首次需拉镜像：国内拉不到就在 /etc/docker/daemon.json 配镜像加速，或 docker load
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-code-review-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      # 只绑本机：查看走 SSH 隧道，不对外暴露
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net

  # ─── Grafana（可视化仪表盘）──────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ai-code-review-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123   # ⚠️ 上线后务必改成你自己的强密码
      - GF_USERS_ALLOW_SIGN_UP=false          # 禁止自助注册
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net

  # ─── Alertmanager（告警推送）────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: ai-code-review-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net

  # ─── DingTalk 适配器（Alertmanager 告警 → 钉钉机器人消息）────────
  # ⚠️ 首次需拉镜像 timonwong/prometheus-webhook-dingtalk；把钉钉机器人
  #    Webhook 填进 alertmanager/dingtalk.yml 后 `docker compose restart alertmanager dingtalk`
  dingtalk:
    image: timonwong/prometheus-webhook-dingtalk:latest
    container_name: ai-code-review-dingtalk
    command:
      - '--config.file=/etc/prometheus-webhook-dingtalk/config.yml'
    volumes:
      - ./alertmanager/dingtalk.yml:/etc/prometheus-webhook-dingtalk/config.yml:ro
    ports:
      - "127.0.0.1:8060:8060"   # 只绑本机：不需要对外暴露
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - review-net

networks:
  review-net:
    driver: bridge

volumes:
  pgdata:
  review_data:
  prometheus_data:
  grafana_data:

# CI/CD：代码 push 到 GitHub 后，自动构建镜像并部署到本地 k3d 集群
# 跑在 self-hosted runner（你自己电脑上），所以能直接操作本地 docker + k3d
name: Deploy to k3d

on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可以在 Actions 页面手动点 Run

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    # 统一用 bash 执行步骤（Windows 默认 PowerShell 跑不了本机的 bash 脚本包装命令如 docker）
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5
        with:
          path: repo   # 固定放到 repo/ 子目录，避免嵌套目录导致找不到 Dockerfile

      - name: 构建 API 镜像
        working-directory: repo
        run: docker build -t ai-code-review-api:latest .

      - name: 导入镜像到 k3d 集群
        run: k3d image import ai-code-review-api:latest -c aicode

      - name: 应用 k8s 清单
        working-directory: repo
        run: |
          # k8s/ 目录里混着非清单文件（grafana-dashboard.json、几个 Dockerfile），
          # kubectl apply -f k8s/ 会把它们当清单解析报错，所以只 apply *.yaml
          for f in k8s/*.yaml; do
            echo "--- apply $f ---"
            kubectl apply -f "$f"
          done

      - name: 重启 api/worker 让新镜像生效
        run: |
          kubectl rollout restart deploy/aicode-api deploy/aicode-worker
          kubectl rollout status deploy/aicode-api --timeout=180s
          kubectl rollout status deploy/aicode-worker --timeout=180s

      - name: 验证服务健康
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/health; then
              echo "✅ health OK"
              exit 0
            fi
            echo "等待 api 就绪... ($i/12)"
            sleep 5
          done
          echo "❌ api 未在 60s 内就绪"
          exit 1
